services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      COOKIE_SECURE: "true"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: production
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_started

  client-build:
    build:
      context: ./client
      target: base
    profiles: ["tools"]
    working_dir: /app
    command: ["sh"]
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    stdin_open: true
    tty: true
    depends_on:
      server:
        condition: service_started

  client-dev:
    build:
      context: ./client
      target: base
    profiles: ["dev"]
    working_dir: /app
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      server:
        condition: service_started

volumes:
  mysql_data:
  uploads_data:
  client_node_modules:
